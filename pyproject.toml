[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsec"
version = "0.1.0"
description = "Agente de segurança com IA para operações SOC"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arlen San"}]

dependencies = [
    "google-genai",
    "python-dotenv",
    "httpx",
    "pydantic>=2.0",
    "rich",
    "msal",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
agentsec = "agentsec.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsec"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
